<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Download HabitFlow AI</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #121212;
    --surface: #1e1e1e;
    --text: #f2f2f2;
    --text-muted: #a0a0a0;
    --accent: #ff8a50;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    padding: 24px;
  }
  .card {
    background: var(--surface);
    border-radius: 24px;
    padding: 40px 32px;
    max-width: 380px;
    width: 100%;
    text-align: center;
    box-shadow: 0 8px 30px rgba(0, 0, 0, 0.4);
  }
  .icon {
    font-size: 48px;
    margin-bottom: 8px;
  }
  h1 {
    margin: 0 0 4px;
    font-size: 24px;
  }
  p.subtitle {
    margin: 0 0 28px;
    color: var(--text-muted);
    font-size: 14px;
  }
  .download-btn {
    display: block;
    background: var(--accent);
    color: #1a1a1a;
    font-weight: 700;
    text-decoration: none;
    padding: 14px 20px;
    border-radius: 14px;
    font-size: 16px;
    margin-bottom: 24px;
  }
  .qr-wrap {
    background: #fff;
    padding: 12px;
    border-radius: 16px;
    display: inline-block;
    margin-bottom: 12px;
  }
  .qr-wrap img {
    display: block;
    width: 180px;
    height: 180px;
  }
  p.hint {
    color: var(--text-muted);
    font-size: 13px;
    margin: 0 0 20px;
  }
  .note {
    text-align: left;
    background: rgba(255, 138, 80, 0.1);
    border: 1px solid rgba(255, 138, 80, 0.3);
    border-radius: 12px;
    padding: 12px 14px;
    font-size: 12.5px;
    color: var(--text-muted);
    line-height: 1.5;
  }
</style>
</head>
<body>
  <div class="card">
    <div class="icon">📱</div>
    <h1>HabitFlow AI</h1>
    <p class="subtitle">Debug build &middot; Android</p>

    <a class="download-btn" href="HabitFlowAI-debug.apk" download>Download APK</a>

    <div class="qr-wrap">
      <img src="qr.png" alt="QR code linking to the HabitFlow AI APK download" width="180" height="180">
    </div>
    <p class="hint">Scan with your phone's camera to download</p>

    <div class="note">
      This is a debug build for testing. On Android you'll need to allow installs from this browser/source (Settings &rarr; Install unknown apps) the first time.
    </div>
  </div>
</body>
</html>
